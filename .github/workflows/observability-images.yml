# Builds the images of the observability example and pushes them to GHCR.
#
# All seven targets are built in one job rather than a matrix: they share the deps stage with
# `go mod download`, which then runs once. Seven parallel jobs would download the modules
# seven times over.
name: observability images

on:
  push:
    branches: [main]
    paths:
      - 'observability/**'
      - '.github/workflows/observability-images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only: anyone running the example locally builds it with docker compose,
      # so a second architecture would double the build for nobody.
      - name: build and push
        run: |
          set -euo pipefail
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          for target in node1 node2 node3 node4 node5 observer slowweb; do
              image="${REGISTRY}/${repo}/observability-${target}"
              echo "::group::${target}"
              docker buildx build \
                  --platform linux/amd64 \
                  --file observability/Dockerfile \
                  --target "${target}" \
                  --tag "${image}:${{ github.sha }}" \
                  --tag "${image}:latest" \
                  --cache-from "type=gha,scope=observability" \
                  --cache-to "type=gha,mode=max,scope=observability" \
                  --push \
                  .
              echo "::endgroup::"
          done

      - name: summary
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
              echo "Built from \`${{ github.sha }}\`:"
              echo
              for target in node1 node2 node3 node4 node5 observer slowweb; do
                  echo "- \`${REGISTRY}/${repo}/observability-${target}:${{ github.sha }}\`"
              done
          } >> "$GITHUB_STEP_SUMMARY"
